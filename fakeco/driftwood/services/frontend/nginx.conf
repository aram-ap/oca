log_format json escape=json '{"ts":"$time_iso8601","service":"frontend",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"duration_ms":$request_time,"upstream_ms":"$upstream_response_time",'
    '"request_id":"$request_id"}';

server {
    listen 80;
    access_log /var/log/driftwood/frontend.log json;
    access_log /dev/stdout json;

    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://orders-api:8000/;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }
}
