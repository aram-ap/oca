{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}
<article style="max-width:26rem;margin:4rem auto">
  <h3>Sign in</h3>
  <p class="muted">Local account. Nothing here talks to the Internet.</p>
  {% if error %}<p style="color:#b02a37">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>User <input name="username" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
</article>
{% endblock %}
