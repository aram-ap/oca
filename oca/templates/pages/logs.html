{% extends "base.html" %}{% block title %}Logs{% endblock %}
{% block content %}
<h3>Ticket event log</h3>
<div data-pager="tbody > tr" data-pager-key="logs" data-pager-start="first">
<div data-pager-controls class="pager"></div>
<div class="table-scroll"><table class="compact">
  <thead><tr><th>Time</th><th>Ticket</th><th>Actor</th><th>Type</th><th>Payload</th></tr></thead>
  <tbody>{% for e in events %}<tr><td class="muted">{{ e.ts | dt }}</td><td><a href="/tickets/{{ e.ticket_id }}">{{ e.ticket_id }}</a></td><td>{{ e.actor.value }}</td><td>{{ e.type.value }}</td><td class="muted"><code>{{ (e.payload | tojson)[:200] }}</code></td></tr>{% endfor %}</tbody>
</table></div>
</div>
{% endblock %}
